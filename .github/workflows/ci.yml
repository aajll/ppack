name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ---------------------------------------------------------------------------
  # Build the library and run the full test suite under ASan + UBSan.
  # float-cast-overflow is added explicitly: GCC does not include it in
  # -fsanitize=undefined (clang does), and it is the check that catches
  # undefined float-to-integer conversions (e.g. NaN) in the scaled paths.
  # ---------------------------------------------------------------------------
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined
          -Dc_args=-fsanitize=float-cast-overflow
          -Dc_link_args=-fsanitize=float-cast-overflow

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Compare with the unmodified 2.4.0 codec
        run: |
          # Pin the pre-extension source. Never replace it with the PR head.
          legacy_commit=fecf8778423c353a54b7387aa0954887a75fbe49
          git fetch --no-tags --depth=1 origin "$legacy_commit"
          mkdir -p "$RUNNER_TEMP/ppack-legacy"
          git archive "$legacy_commit" include src | tar -x -C "$RUNNER_TEMP/ppack-legacy"
          meson setup build_compat tests/compatibility \
            --buildtype=debug \
            "-Dlegacy_root=$RUNNER_TEMP/ppack-legacy" \
            -Db_sanitize=address,undefined \
            -Dc_args=-fsanitize=float-cast-overflow \
            -Dc_link_args=-fsanitize=float-cast-overflow
          meson test -C build_compat --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: |
            build/meson-logs/testlog.txt
            build_compat/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Exercise the buffer-size override at CAN-FD size and at the codec's
  # maximum. Runtime sizes must remain independent of this default.
  # ---------------------------------------------------------------------------
  override-test:
    name: "Override test (PPACK_PAYLOAD_BITS=${{ matrix.bits }})"
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        bits: [512, 65528]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + sanitizers + buffer-size override)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined
          "-Dc_args=-DPPACK_PAYLOAD_BITS=${{ matrix.bits }} -fsanitize=float-cast-overflow"
          -Dc_link_args=-fsanitize=float-cast-overflow

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-override-${{ matrix.bits }}
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode (no tests, no
  # sanitizers) - the configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (release)
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Code coverage gate. Builds with gcov instrumentation, runs the full
  # test suite, and fails the job if line or branch coverage drops below
  # the threshold. The suite achieves 100% line and branch coverage; the
  # gate is set there to keep it that way.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson, ninja and gcovr
        run: uv tool install meson && uv tool install ninja && uv tool install gcovr

      - name: Configure (coverage)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # Cross-compile the library with TI's C2000 code generation tools, a target
  # with CHAR_BIT == 16 and a 16-bit int, under both object ABIs. The
  # installer is checksum-pinned and the installed toolchain is cached.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done

  # ---------------------------------------------------------------------------
  # Formatting, with the clang-format release pinned in scripts/format.sh.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # MISRA C:2023 analysis with misch. The analysis reports zero findings, so
  # CI fails on any finding; deviations are justified at point of use or in
  # misra-deviations.txt.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      # Ubuntu 24.04 ships cppcheck 2.13, whose findings differ from current
      # releases. The Homebrew bottle is current; brew is preinstalled.
      - name: Install cppcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cppcheck --version

      - name: Install meson, ninja and misch
        run: uv tool install meson && uv tool install ninja && uv tool install misch

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse
        run: misch run -v

      - name: Deviation record
        run: misch deviations
